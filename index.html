<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We Are Alone</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0d0d;
            color: #ffffff;
        }

        /* Background Image with Fallback */
        .bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            filter: brightness(0.9);
        }

        /* Overlay Tint */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.6) 100%);
            z-index: 2;
        }

        /* Main Container */
        .app-container {
            position: relative;
            z-index: 3;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 32px;
        }
        
        @media (max-width: 640px) {
            .bg-container {
                background-position: 62% center;
            }

            .app-container {
                padding: 16px;
            }

            .music-player {
                padding: 10px 16px;
                gap: 12px;
            }

            .album-art {
                width: 50px;
                height: 50px;
            }

            .hero-title {
                font-size: 3rem;
            }

            .nav-links span {
                display: none;
            }
        }

        /* Top Bar Header */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        /* Real-time Clock */
        .live-clock {
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            font-variant-numeric: tabular-nums;
        }

        /* Online Status Pill */
        .online-status {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 13px;
            font-weight: 500;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        /* External Links */
        .nav-links {
            display: flex;
            gap: 12px;
        }

        .link-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .link-pill:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        /* Main Hero Center Title */
        .center-hero {
            text-align: center;
            margin-top: -40px;
        }

        .hero-title {
            font-family: 'Rozha One', serif;
            font-size: clamp(3.5rem, 8vw, 7.5rem);
            line-height: 1.05;
            color: #ffffff;
            text-shadow: 0 10px 30px rgba(0,0,0,0.6);
            letter-spacing: 2px;
        }

        /* Bottom Floating Music Bar Container */
        .player-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 12px;
            position: relative;
        }

        /* Playlist Drawer Toggle Arrow */
        .playlist-toggle-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            width: 38px;
            height: 24px;
            border-radius: 12px 12px 0 0;
            border-bottom: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            margin-bottom: -1px;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .playlist-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .playlist-toggle-btn svg {
            transition: transform 0.3s ease;
        }

        .playlist-toggle-btn.open svg {
            transform: rotate(180deg);
        }

        /* Liquid Glass Music Selection Drawer */
        .playlist-drawer {
            position: absolute;
            bottom: calc(100% + 8px);
            width: 100%;
            max-width: 760px;
            max-height: 250px;
            overflow-y: auto;
            background: rgba(20, 20, 20, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 10px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: none;
            flex-direction: column;
            gap: 6px;
            z-index: 20;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .playlist-drawer.active {
            display: flex;
        }

        .playlist-drawer::-webkit-scrollbar {
            width: 6px;
        }

        .playlist-drawer::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .playlist-item.active {
            background: rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .playlist-item img {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            object-fit: cover;
        }

        .playlist-item-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .playlist-item-title {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-item-artist {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Liquid Glass Music Player Surface */
        .music-player {
            width: 100%;
            max-width: 760px;
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 32px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 18px;
            box-shadow:
                inset 0 1px 1px rgba(255, 255, 255, 0.45),
                inset 0 -1px 1px rgba(255, 255, 255, 0.08),
                0 20px 50px rgba(0,0,0,0.35);
            isolation: isolate;
        }

        /* Cover Artwork */
        .album-art {
            width: 64px;
            height: 64px;
            border-radius: 22px;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.45);
            box-shadow:
                0 8px 25px rgba(0,0,0,0.35),
                inset 0 1px 1px rgba(255,255,255,0.4);
            animation: rotate 20s linear infinite;
            animation-play-state: paused;
            flex-shrink: 0;
            background: rgba(255,255,255,0.12);
        }

        .album-art.playing {
            animation-play-state: running;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Track Info & Progress */
        .player-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        .track-info {
            display: flex;
            flex-direction: column;
        }

        .track-title {
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ffffff;
        }

        .track-artist {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Seek Bar Container */
        .progress-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .time-display {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.8);
            font-variant-numeric: tabular-nums;
            min-width: 65px;
        }

        .seek-bar-bg {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .seek-bar-fill {
            height: 100%;
            width: 0%;
            background: #ffffff;
            border-radius: 4px;
            transition: width 0.1s linear;
        }

        /* Player Controls */
        .player-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .ctrl-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.16);
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            opacity: 0.9;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.25s ease;
        }

        .ctrl-btn:hover {
            background: rgba(255,255,255,0.18);
            border-color: rgba(255,255,255,0.35);
            opacity: 1;
            transform: scale(1.08);
        }

        .ctrl-btn:active {
            transform: scale(0.92);
        }

        .play-btn {
            width: 44px;
            height: 44px;
            background: rgba(255,255,255,0.88);
            color: #111;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.8);
            opacity: 1;
            box-shadow:
                inset 0 1px 2px rgba(255,255,255,0.9),
                0 6px 18px rgba(0,0,0,0.25);
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
        }

        .play-btn:hover {
            transform: scale(1.08);
            background: rgba(255,255,255,0.98);
            box-shadow:
                inset 0 1px 2px rgba(255,255,255,1),
                0 8px 25px rgba(0,0,0,0.3);
        }

        .play-btn:active {
            transform: scale(0.94);
        }
    </style>
</head>

    <!-- JavaScript Logic -->
    <script>
        // --- FIREBASE REAL-TIME ONLINE COUNTER LOGIC ---
        try {
            if (typeof firebaseConfig !== 'undefined') {
                firebase.initializeApp(firebaseConfig);
                const db = firebase.database();
                const onlineRef = db.ref('online_users');
                const myUserRef = onlineRef.push();

                db.ref('.info/connected').on('value', (snap) => {
                    if (snap.val() === true) {
                        myUserRef.onDisconnect().remove();
                        myUserRef.set(true);
                    }
                });

                onlineRef.on('value', (snap) => {
                    const count = snap.numChildren();
                    document.getElementById('onlineCount').textContent = `${count} Online`;
                });
            }
        } catch (err) {
            console.log("Firebase tracking error:", err);
        }

      // --- 1. LIQUID GLASS ENGINE (Refraction, Specular, Displacement Map) ---
        (function () {
            'use strict';
            const DEFAULT_CONFIG = {
                glassThickness: 80,
                bezelWidth: 40,
                ior: 1.4,
                scaleRatio: 1.0,
                blur: 1,
                specularOpacity: 0.6,
                specularSat: 0,
                tintColor: '255,255,255',
                tintOpacity: 0.05,
                innerShadow: 'rgba(255,255,255,0.2)',
                innerShadowBlur: 10,
                innerShadowSpread: 0,
                balancedSpecular: false
            };

            const targets = new Map();
            let defs = null;

            function surfaceFn(x) {
                return Math.pow(1 - Math.pow(1 - x, 4), 0.25);
            }

            function calcRefractionProfile(glassThickness, bezelWidth, ior, samples) {
                samples = samples || 128;
                const eta = 1 / ior;
                function refract(nx, ny) {
                    const dot = ny;
                    const k = 1 - eta * eta * (1 - dot * dot);
                    if (k < 0) return null;
                    const sq = Math.sqrt(k);
                    return [-(eta * dot + sq) * nx, eta - (eta * dot + sq) * ny];
                }
                const p = new Float64Array(samples);
                for (let i = 0; i < samples; i++) {
                    const x = i / samples;
                    const y = surfaceFn(x);
                    const dx = x < 1 ? 0.0001 : -0.0001;
                    const y2 = surfaceFn(x + dx);
                    const deriv = (y2 - y) / dx;
                    const mag = Math.sqrt(deriv * deriv + 1);
                    const ref = refract(-deriv / mag, -1 / mag);
                    p[i] = ref ? ref[0] * ((y * bezelWidth + glassThickness) / ref[1]) : 0;
                }
                return p;
            }

            function generateDisplacementMap(w, h, radius, bezelWidth, profile, maxDisp) {
                const c = document.createElement('canvas');
                c.width = w; c.height = h;
                const ctx = c.getContext('2d');
                const img = ctx.createImageData(w, h);
                const d = img.data;
                for (let i = 0; i < d.length; i += 4) { d[i] = 128; d[i + 1] = 128; d[i + 2] = 0; d[i + 3] = 255; }
                const r = radius, rSq = r * r, r1Sq = (r + 1) ** 2;
                const rBSq = Math.max(r - bezelWidth, 0) ** 2;
                const wB = w - r * 2, hB = h - r * 2, S = profile.length;
                for (let y1 = 0; y1 < h; y1++) {
                    for (let x1 = 0; x1 < w; x1++) {
                        const x = x1 < r ? x1 - r : x1 >= w - r ? x1 - r - wB : 0;
                        const y = y1 < r ? y1 - r : y1 >= h - r ? y1 - r - hB : 0;
                        const dSq = x * x + y * y;
                        if (dSq > r1Sq || dSq < rBSq) continue;
                        const dist = Math.sqrt(dSq);
                        const fromSide = r - dist;
                        const op = dSq < rSq ? 1 : 1 - (dist - Math.sqrt(rSq)) / (Math.sqrt(r1Sq) - Math.sqrt(rSq));
                        if (op <= 0 || dist === 0) continue;
                        const cos = x / dist, sin = y / dist;
                        const bi = Math.min(((fromSide / bezelWidth) * S) | 0, S - 1);
                        const disp = profile[bi] || 0;
                        const dX = (-cos * disp) / maxDisp, dY = (-sin * disp) / maxDisp;
                        const idx = (y1 * w + x1) * 4;
                        d[idx] = (128 + dX * 127 * op + 0.5) | 0;
                        d[idx + 1] = (128 + dY * 127 * op + 0.5) | 0;
                    }
                }
                ctx.putImageData(img, 0, 0);
                return c.toDataURL();
            }

            function generateSpecularMap(w, h, radius, bezelWidth, balanced) {
                const angle = Math.PI / 3;
                const c = document.createElement('canvas');
                c.width = w; c.height = h;
                const ctx = c.getContext('2d');
                const img = ctx.createImageData(w, h);
                const d = img.data; d.fill(0);
                const r = radius, rSq = r * r, r1Sq = (r + 1) ** 2;
                const rBSq = Math.max(r - bezelWidth, 0) ** 2;
                const wB = w - r * 2, hB = h - r * 2;
                const sv = [Math.cos(angle), Math.sin(angle)];
                for (let y1 = 0; y1 < h; y1++) {
                    for (let x1 = 0; x1 < w; x1++) {
                        const x = x1 < r ? x1 - r : x1 >= w - r ? x1 - r - wB : 0;
                        const y = y1 < r ? y1 - r : y1 >= h - r ? y1 - r - hB : 0;
                        const dSq = x * x + y * y;
                        if (dSq > r1Sq || dSq < rBSq) continue;
                        const dist = Math.sqrt(dSq);
                        const fromSide = r - dist;
                        const op = dSq < rSq ? 1 : 1 - (dist - Math.sqrt(rSq)) / (Math.sqrt(r1Sq) - Math.sqrt(rSq));
                        if (op <= 0 || dist === 0) continue;
                        const cos = x / dist, sin = -y / dist;
                        const dot = balanced ? 1 : Math.abs(cos * sv[0] + sin * sv[1]);
                        const edge = Math.sqrt(Math.max(0, 1 - (1 - fromSide) ** 2));
                        const coeff = dot * edge;
                        const col = (255 * coeff) | 0;
                        const alpha = (col * coeff * op) | 0;
                        const idx = (y1 * w + x1) * 4;
                        d[idx] = col; d[idx + 1] = col; d[idx + 2] = col; d[idx + 3] = alpha;
                    }
                }
                ctx.putImageData(img, 0, 0);
                return c.toDataURL();
            }

            function svgEl(tag, attrs) {
                const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
                for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
                return el;
            }

            function ensureDefs() {
                const old = document.getElementById('demo-lg-defs');
                if (old && document.documentElement.contains(old)) {
                    defs = old;
                    return;
                }
                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.setAttribute('width', '0');
                svg.setAttribute('height', '0');
                svg.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;pointer-events:none;z-index:-1;';
                defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
                defs.id = 'demo-lg-defs';
                svg.appendChild(defs);
                document.documentElement.appendChild(svg);
            }

            function buildFilter(id, w, h, radius, cfg) {
                const bezel = Math.min(cfg.bezelWidth, radius - 1, Math.min(w, h) / 2 - 1);
                const profile = calcRefractionProfile(cfg.glassThickness, bezel, cfg.ior, 128);
                const maxDisp = Math.max(...Array.from(profile).map(Math.abs)) || 1;
                const dispUrl = generateDisplacementMap(w, h, radius, bezel, profile, maxDisp);
                const specUrl = generateSpecularMap(w, h, radius, bezel * 2.5, !!cfg.balancedSpecular);
                const scale = maxDisp * cfg.scaleRatio;
                const pad = cfg.balancedSpecular ? 0.36 : 0;
                const fx = Math.round(-w * pad);
                const fy = Math.round(-h * pad);
                const fw = Math.round(w * (1 + pad * 2));
                const fh = Math.round(h * (1 + pad * 2));
                const filter = svgEl('filter', {
                    id,
                    x: String(fx),
                    y: String(fy),
                    width: String(fw),
                    height: String(fh),
                    filterUnits: 'userSpaceOnUse',
                    primitiveUnits: 'userSpaceOnUse',
                    'color-interpolation-filters': 'sRGB'
                });
                const blur = svgEl('feGaussianBlur', { in: 'SourceGraphic', stdDeviation: cfg.blur, result: 'blurred' });
                const dispImg = svgEl('feImage', { href: dispUrl, x: 0, y: 0, width: w, height: h, result: 'disp_map' });
                const dispMap = svgEl('feDisplacementMap', {
                    in: 'blurred',
                    in2: 'disp_map',
                    scale,
                    xChannelSelector: 'R',
                    yChannelSelector: 'G',
                    result: 'displaced'
                });
                const sat = svgEl('feColorMatrix', { in: 'displaced', type: 'saturate', values: cfg.specularSat, result: 'displaced_sat' });
                const spec = svgEl('feImage', { href: specUrl, x: 0, y: 0, width: w, height: h, result: 'spec_layer' });
                const comp = svgEl('feComposite', { in: 'displaced_sat', in2: 'spec_layer', operator: 'in', result: 'spec_masked' });
                const tr = svgEl('feComponentTransfer', { in: 'spec_layer', result: 'spec_faded' });
                tr.appendChild(svgEl('feFuncA', { type: 'linear', slope: cfg.specularOpacity }));
                const b1 = svgEl('feBlend', { in: 'spec_masked', in2: 'displaced', mode: 'normal', result: 'with_sat' });
                const b2 = svgEl('feBlend', { in: 'spec_faded', in2: 'with_sat', mode: 'normal' });
                filter.append(blur, dispImg, dispMap, sat, spec, comp, tr, b1, b2);
                return filter;
            }

            function applyGlass(el, cfg) {
                if (targets.has(el)) return;
                if (getComputedStyle(el).position === 'static') el.style.position = 'relative';
                const refr = document.createElement('div');
                refr.className = 'lg-layer';
                refr.style.cssText = 'position:absolute;inset:0;z-index:0;pointer-events:none;';
                const tint = document.createElement('div');
                tint.className = 'lg-layer';
                tint.style.cssText = 'position:absolute;inset:0;z-index:0;pointer-events:none;';
                el.insertBefore(tint, el.firstChild);
                el.insertBefore(refr, el.firstChild);
                let filterNode = null;
                let timer = null;

                function elevate() {
                    Array.from(el.children).forEach((c) => {
                        if (c === refr || c === tint) return;
                        if (getComputedStyle(c).position === 'static') c.style.position = 'relative';
                        if (!c.style.zIndex) c.style.zIndex = '1';
                    });
                }

                function rebuild() {
                    ensureDefs();
                    const rect = el.getBoundingClientRect();
                    const w = Math.round(el.offsetWidth || rect.width);
                    const h = Math.round(el.offsetHeight || rect.height);
                    if (w < 4 || h < 4) return;
                    const dataR = parseFloat(el.getAttribute('data-radius') || '0');
                    const cssR = parseFloat(getComputedStyle(el).borderTopLeftRadius || '0');
                    const r = Math.max(2, Math.min(dataR || cssR || 24, w / 2, h / 2));
                    if (filterNode) filterNode.remove();
                    const id = 'demo-lg-' + Math.random().toString(36).slice(2, 10);
                    filterNode = buildFilter(id, w, h, r, cfg);
                    defs.appendChild(filterNode);
                    refr.style.borderRadius = r + 'px';
                    refr.style.backdropFilter = `url(#${id})`;
                    refr.style.webkitBackdropFilter = `url(#${id})`;
                    tint.style.borderRadius = r + 'px';
                    tint.style.backgroundColor = `rgba(${cfg.tintColor},${cfg.tintOpacity})`;
                    tint.style.boxShadow = `inset 0 0 ${cfg.innerShadowBlur}px ${cfg.innerShadowSpread}px ${cfg.innerShadow}`;
                    elevate();
                }

                function schedule() {
                    clearTimeout(timer);
                    timer = setTimeout(rebuild, 16);
                }

                const ro = new ResizeObserver(schedule);
                ro.observe(el);
                targets.set(el, { rebuild });
                rebuild();
            }

            function initGlass() {
                ensureDefs();
                document.querySelectorAll('.lg-demo-target').forEach((el) => applyGlass(el, DEFAULT_CONFIG));
            }

            window.addEventListener('load', initGlass);
        })();

        let currentTrackIndex = 0;
        let autoCloseTimer = null;

        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const trackTitle = document.getElementById('trackTitle');
        const trackArtist = document.getElementById('trackArtist');
        const albumArt = document.getElementById('albumArt');
        const seekBarFill = document.getElementById('seekBarFill');
        const seekBarBg = document.getElementById('seekBarBg');
        const timeDisplay = document.getElementById('timeDisplay');
        const playlistToggle = document.getElementById('playlistToggle');
        const playlistDrawer = document.getElementById('playlistDrawer');

        // Render Playlist Drawer
        function renderPlaylistDrawer() {
            playlistDrawer.innerHTML = '';
            playlist.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = `playlist-item ${index === currentTrackIndex ? 'active' : ''}`;
                item.innerHTML = `
                    <img src="${track.cover}" alt="cover">
                    <div class="playlist-item-info">
                        <span class="playlist-item-title">${track.title}</span>
                        <span class="playlist-item-artist">${track.artist}</span>
                    </div>
                `;
                item.addEventListener('click', () => {
                    currentTrackIndex = index;
                    loadTrack(currentTrackIndex);
                    audio.play().then(() => {
                        playIcon.style.display = 'none';
                        pauseIcon.style.display = 'block';
                        albumArt.classList.add('playing');
                    }).catch(err => console.log(err));
                    closePlaylistDrawer();
                });
                playlistDrawer.appendChild(item);
            });
                      }
      function openPlaylistDrawer() {
            playlistDrawer.classList.add('active');
            playlistToggle.classList.add('open');
            renderPlaylistDrawer();
            resetAutoCloseTimer();
        }

        function closePlaylistDrawer() {
            playlistDrawer.classList.remove('active');
            playlistToggle.classList.remove('open');
            if (autoCloseTimer) clearTimeout(autoCloseTimer);
        }

        function resetAutoCloseTimer() {
            if (autoCloseTimer) clearTimeout(autoCloseTimer);
            autoCloseTimer = setTimeout(() => {
                closePlaylistDrawer();
            }, 5000);
        }

        playlistToggle.addEventListener('click', () => {
            if (playlistDrawer.classList.contains('active')) {
                closePlaylistDrawer();
            } else {
                openPlaylistDrawer();
            }
        });

        // User interacts with drawer -> reset 5s timer
        playlistDrawer.addEventListener('mousemove', resetAutoCloseTimer);
        playlistDrawer.addEventListener('touchstart', resetAutoCloseTimer);

        function loadTrack(index) {
            const track = playlist[index];
            trackTitle.textContent = track.title;
            trackArtist.textContent = track.artist;
            albumArt.src = track.cover;
            audio.src = track.src;
            seekBarFill.style.width = '0%';
            timeDisplay.textContent = '0:00 / 0:00';
            renderPlaylistDrawer();
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play().then(() => {
                    playIcon.style.display = 'none';
                    pauseIcon.style.display = 'block';
                    albumArt.classList.add('playing');
                }).catch(err => {
                    console.log("Audio play error:", err);
                });
            } else {
                audio.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                albumArt.classList.remove('playing');
            }
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                seekBarFill.style.width = `${percent}%`;
                timeDisplay.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
            }
        });

        seekBarBg.addEventListener('click', (e) => {
            const rect = seekBarBg.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const width = rect.width;
            if (audio.duration) {
                audio.currentTime = (clickX / width) * audio.duration;
            }
        });

        prevBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrackIndex);
            audio.play().then(() => {
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                albumArt.classList.add('playing');
            }).catch(() => {});
        });

        nextBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            audio.play().then(() => {
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                albumArt.classList.add('playing');
            }).catch(() => {});
        });

        audio.addEventListener('ended', () => {
            nextBtn.click();
        });

        playBtn.addEventListener('click', togglePlay);

        // --- 3. REAL-TIME CLOCK ---
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            const ampm = hours >= 12 ? 'pm' : 'am';
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds} ${ampm}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Initial Load
        loadTrack(currentTrackIndex);
